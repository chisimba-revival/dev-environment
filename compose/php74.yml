name: chisimba-php74

services:
  web:
    build:
      context: ..
      dockerfile: docker/php74/Dockerfile
    container_name: chisimba-php74-web
    ports:
      - "8081:80"
    volumes:
      - ../runtime/php74-ch:/var/www/html/ch
    depends_on:
      - db

  db:
    image: mariadb:10.11.18
    container_name: chisimba-php74-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - php74_db:/var/lib/mysql

volumes:
  php74_db:
