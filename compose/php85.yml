name: chisimba-php85

services:
  web:
    build:
      context: ..
      dockerfile: docker/php85/Dockerfile
    container_name: chisimba-php85-web
    ports:
      - "8085:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../runtime/php85-ch:/var/www/html/ch
    depends_on:
      - db

  nginx:
    image: nginx:1.31.3-alpine
    container_name: chisimba-php85-nginx
    ports:
      - "8445:443"
    volumes:
      - ../local-https/nginx-php85.conf:/etc/nginx/nginx.conf:ro
      - ../local-https/certs:/etc/nginx/certs:ro
    depends_on:
      - web

  db:
    image: mariadb:10.11.18
    container_name: chisimba-php85-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - php85_db:/var/lib/mysql

volumes:
  php85_db:
