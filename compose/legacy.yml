services:
  web:
    build:
      context: ..
      dockerfile: docker/legacy/Dockerfile
    container_name: chisimba-legacy-web
    ports:
      - "8080:80"
    volumes:
      - ../runtime/ch:/var/www/html/ch
    depends_on:
      - db

  db:
    image: mariadb:10.11.18
    container_name: chisimba-legacy-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - legacy_db:/var/lib/mysql

volumes:
  legacy_db:
