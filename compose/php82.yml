name: chisimba-php82

services:
  web:
    build:
      context: ..
      dockerfile: docker/php82/Dockerfile
    container_name: chisimba-php82-web
    ports:
      - "8082:80"
    volumes:
      - ../runtime/php82-ch:/var/www/html/ch
    depends_on:
      - db

  db:
    image: mariadb:10.11.18
    container_name: chisimba-php82-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - php82_db:/var/lib/mysql

volumes:
  php82_db:
