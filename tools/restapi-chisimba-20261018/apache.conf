# API aliases for the existing root-mounted installation. Preserve all other routes.
<Directory /var/www/html>
    RewriteEngine On
    RewriteRule ^api/v1/(.*)$ /index.php?module=api/v1&action=$1 [QSA,L]
    RewriteRule ^\.well-known/jwks\.json$ /index.php?module=api/v1&action=auth/jwks [QSA,L]
</Directory>
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
