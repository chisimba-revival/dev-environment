TEXT: mod_messaging_v2_help_access|Access help|Conversations automatically uses your current Chisimba scope. Authorised staff can start its conversation. Membership and conversation bans are checked on every request, including retries.
TEXT: mod_messaging_v2_help_send|Send help|Write a message and send. Messages are visible to [-context-] members. Replies update while this page is visible. Your text stays in place while updates arrive. Your browser keeps unsent text while this page stays open. Images are not available yet.
TEXT: mod_messaging_v2_help_announcements|Announcement help|Announcements flow like chat messages. Authorised staff can write and send a [-context-] announcement here; only site administrators can send administrator announcements. Everyone else can read. No title is needed and there is no reply action. Messages use the existing Announcements store and its audience rules. A failed send keeps your text; retry it unchanged to avoid a duplicate.
TEXT: mod_messaging_v2_help_read|Read help|Earlier messages opens older history. Messages are marked read when this tab is visible and you reach the bottom of the conversation. New messages does not move you away from earlier messages until you choose it. Without JavaScript, use Mark displayed messages read.

