UPDATE_DESCRIPTION: Limit the Assessment palette to enabled course tools with provider-owned activities.
UPDATE_DESCRIPTION: Expose the latest meaningful page visit to cross-course My Learning consumers.
UPDATE_DESCRIPTION: Resolve the all-[-chapters-] navigation label through the established system-text service.
UPDATE_DESCRIPTION: Use the shared course-completion decision and offer an assigned certificate after eligible completion.
UPDATE_DESCRIPTION: Present the successful document-import destination as a primary Open course content action.
