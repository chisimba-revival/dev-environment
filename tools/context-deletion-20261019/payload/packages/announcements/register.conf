MODULE_ID: announcements
MODULE_ICON: megaphone
MODULE_NAME: Announcements
MODULE_DESCRIPTION: Publish typed announcements to selected site or [-context-] audiences, with optional notification and external delivery.
MODULE_AUTHORS: Joel Kimilu, Tohir Solomons, Paul Mungai
MODULE_RELEASEDATE: 2008 01 25
MODULE_VERSION: 0.416
UPDATE_DESCRIPTION: Present the single valid General type for selected-context publishers.
UPDATE_DESCRIPTION: Explain announcement type, audience, scope and Updates delivery with contextual Help.
UPDATE_DESCRIPTION: Classify the instructor update block for [-author-] and administrator dashboards.
UPDATE_DESCRIPTION: Complete the active-journey terminology audit and preserve configured role and context names.
UPDATE_DESCRIPTION: Retire the legacy quick-add and latest-announcement blocks.
UPDATE_DESCRIPTION: Show fixed selected-context scope as text for instructors instead of a one-item selector.
UPDATE_DESCRIPTION: Rebuild announcement details with the shared skin primitives and icon service.
UPDATE_DESCRIPTION: Limit the instructor notice block to four items from the last seven days and use configured dates.
UPDATE_DESCRIPTION: Make author audience selection sufficient for the instructor announcement block.
UPDATE_DESCRIPTION: Replace the AJAX table archive with a responsive Updates destination and standard pagination.
UPDATE_DESCRIPTION: Clarify announcement scope, introduction and title sizing.
UPDATE_DESCRIPTION: Simplify announcement content and modernise the publishing presentation.
UPDATE_DESCRIPTION: Add typed audiences, explicit Updates delivery, resource links and an instructor What’s new block.
UPDATE_DESCRIPTION: Make Announcements usable without the optional Feed service or retired legacy Mail module.
