date.timezone = Africa/Johannesburg

display_errors = On
display_startup_errors = On
log_errors = On
error_log = /tmp/chisimba-php74-error.log

; Show compatibility problems, but initially suppress deprecated and strict
; messages because output before HTTP headers can prevent Chisimba loading.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 300
post_max_size = 64M
upload_max_filesize = 64M

include_path = ".:/usr/local/lib/php"
