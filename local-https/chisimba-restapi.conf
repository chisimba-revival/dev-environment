# The existing site is mounted at /ch. Keep API routes on that installation.
<Directory /var/www/html/ch>
    RewriteEngine On
    RewriteRule ^api/v1/(.*)$ /ch/index.php?module=api/v1&action=$1 [QSA,L]
    RewriteRule ^\.well-known/jwks\.json$ /ch/index.php?module=api/v1&action=auth/jwks [QSA,L]
</Directory>
# Preserve Authorization for PHP when requests pass through Apache.
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
