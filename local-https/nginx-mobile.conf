events {}
http {
  access_log off;
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/mobile-tls/localhost.crt;
    ssl_certificate_key /etc/mobile-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    location /ch/api/v1/ {
      proxy_pass http://web:80;
      proxy_set_header Host chisimba.test:8445;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8445;
      proxy_redirect off;
    }
    location / { return 404; }
  }
}
