# Isolated TLS proxy for the PHP 8.5 Chisimba stack.
events {}
http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log notice;
    server {
        listen 443 ssl;
        server_name chisimba.test;
        # Match PHP's 64 MB POST ceiling so document-ingest uploads reach
        # application-level validation instead of failing at the TLS proxy.
        client_max_body_size 64m;
        ssl_certificate /etc/nginx/certs/chisimba.test.crt;
        ssl_certificate_key /etc/nginx/certs/chisimba.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            # Allow the AI service to finish its bounded request and render errors.
            proxy_read_timeout 360s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8445;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }
    }
}
