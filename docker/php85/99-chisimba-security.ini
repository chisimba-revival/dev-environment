; Production web-session and error-disclosure baseline.
; TLS is terminated by the trusted reverse proxy and forwarded to Apache.
session.use_only_cookies = On
session.use_strict_mode = On
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax

; Never disclose PHP implementation details or runtime failures to visitors.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
